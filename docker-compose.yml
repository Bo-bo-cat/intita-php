services:
  web:
    image: nginx:alpine
    container_name: intita
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - intita

  php:
    build:
      context: ./docker/php
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    image: intita/php:8.4-fpm
    container_name: intita_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    networks:
      - intita

networks:
  intita:
    driver: bridge
